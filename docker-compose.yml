services:
  mqtt-monitor:
    container_name: container-mqtt-monitor${branch:+-${branch}}
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HTTP_PORT: ${HTTP_PORT:-3205}
      MQTT_URL: ${MQTT_URL:?MQTT_URL is required}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      IMPORTANT_TOPICS: ${IMPORTANT_TOPICS:-}
      IMPORTANT_CAMERAS: ${IMPORTANT_CAMERAS:-}
      TOPIC_SILENCE_MS: ${TOPIC_SILENCE_MS:-45000}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_SOCKS_HOST: ${TELEGRAM_SOCKS_HOST:-}
      TELEGRAM_SOCKS_PORT: ${TELEGRAM_SOCKS_PORT:-1080}
      TELEGRAM_SOCKS_USERNAME: ${TELEGRAM_SOCKS_USERNAME:-}
      TELEGRAM_SOCKS_PASSWORD: ${TELEGRAM_SOCKS_PASSWORD:-}
    expose:
      - "3205"
    networks:
      - proxy

networks:
  proxy:
    external: true
