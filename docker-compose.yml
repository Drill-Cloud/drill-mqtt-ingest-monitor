services:
  mqtt-monitor:
    container_name: container-mqtt-monitor${branch:+-${branch}}
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HTTP_PORT: 3205
      MQTT_URL: ${MQTT_URL:-mqtt://drillcloud.ru:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      IMPORTANT_TOPICS: ${IMPORTANT_TOPICS:-data/edge5/video/v2/+,data/edge5/modbus/v3}
      EDGE5_MODBUS_IMPORTANT_TAGS: ${EDGE5_MODBUS_IMPORTANT_TAGS:-edge5-v3-wk,edge5-v3-hk,edge5-v3-vw,edge5-v3-pdk,edge5-v3-h2s,edge5-v3-nrot,edge5-v3-vsp}
      EDGE5_VIDEO_IMPORTANT_CAMERAS: ${EDGE5_VIDEO_IMPORTANT_CAMERAS:-camera-11,camera-12,camera-13}
      TOPIC_STALE_MS: ${TOPIC_STALE_MS:-15000}
      TOPIC_DEAD_MS: ${TOPIC_DEAD_MS:-45000}
      ACTIVITY_LOG_INTERVAL_MS: ${ACTIVITY_LOG_INTERVAL_MS:-60000}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_CHANNEL_NAME: ${TELEGRAM_CHANNEL_NAME:-drillcloud.health}
      TELEGRAM_MESSAGE_THREAD_ID: ${TELEGRAM_MESSAGE_THREAD_ID:-}
    expose:
      - "3205"
    networks:
      - proxy

networks:
  proxy:
    external: true
